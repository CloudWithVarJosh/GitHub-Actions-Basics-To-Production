
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cwvj-frontend
  namespace: dev
  labels:
    app.kubernetes.io/name: cwvj-mega-project
    app.kubernetes.io/instance: cwvj-mega-project-dev
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cwvj-mega-project
    app.kubernetes.io/managed-by: github-actions
  annotations:
    description: "NGINX frontend for the CWVJ three-tier demo"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cwvj-mega-project
      app.kubernetes.io/instance: cwvj-mega-project-dev
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cwvj-mega-project
        app.kubernetes.io/instance: cwvj-mega-project-dev
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cwvj-mega-project
      annotations:
        description: "NGINX serves the UI and proxies API requests"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cwvj-mega-project
              app.kubernetes.io/instance: cwvj-mega-project-dev
              app.kubernetes.io/component: frontend

      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cwvj-frontend
  namespace: dev
  labels:
    app.kubernetes.io/name: cwvj-mega-project
    app.kubernetes.io/instance: cwvj-mega-project-dev
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cwvj-mega-project
    app.kubernetes.io/managed-by: github-actions
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cwvj-mega-project
    app.kubernetes.io/instance: cwvj-mega-project-dev
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
