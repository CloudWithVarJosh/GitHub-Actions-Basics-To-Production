
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cwvj-backend
  namespace: prod
  labels:
    app.kubernetes.io/name: cwvj-mega-project
    app.kubernetes.io/instance: cwvj-mega-project-prod
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cwvj-mega-project
    app.kubernetes.io/managed-by: github-actions
  annotations:
    description: "Spring Boot backend API"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cwvj-mega-project
      app.kubernetes.io/instance: cwvj-mega-project-prod
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cwvj-mega-project
        app.kubernetes.io/instance: cwvj-mega-project-prod
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: cwvj-mega-project
      annotations:
        description: "Spring Boot backend API"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cwvj-mega-project
              app.kubernetes.io/instance: cwvj-mega-project-prod
              app.kubernetes.io/component: backend

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              timeout=300
              elapsed=0

              until nc -z -w 2 cwvj-postgres 5432; do
                if [ "$elapsed" -ge "$timeout" ]; then
                  echo "PostgreSQL endpoint did not become reachable within 300 seconds"
                  exit 1
                fi

                sleep 5
                elapsed=$((elapsed + 5))
              done

              echo "PostgreSQL endpoint is reachable"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              value: "jdbc:postgresql://cwvj-postgres:5432/__DB_NAME__"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: password

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: cwvj-backend
  namespace: prod
  labels:
    app.kubernetes.io/name: cwvj-mega-project
    app.kubernetes.io/instance: cwvj-mega-project-prod
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cwvj-mega-project
    app.kubernetes.io/managed-by: github-actions
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cwvj-mega-project
    app.kubernetes.io/instance: cwvj-mega-project-prod
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP